[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.1.0"
description = "Proof-carrying claim-investigation agent powered by FalkorDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "falkordb>=1.8.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]
